comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        informational: true

ignore:
  - "**/dist/**"
  - "**/node_modules/**"
  - "test/**"
  - "**/*.test.ts"
  - "**/*.d.ts"
