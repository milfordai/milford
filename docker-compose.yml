services:
  loage:
    build: .
    ports: ["8080:8080"]
    volumes:
      - ./loage.config.yaml:/config/loage.config.yaml:ro
      - ./flows:/config/flows:ro
    environment:
      - LOAGE_TOKEN
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GROQ_API_KEY
      - TYPESAFE_API_KEY
    restart: unless-stopped
