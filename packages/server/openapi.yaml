openapi: 3.1.0
info:
  title: Milford HTTP API
  version: 0.0.3
  description: |
    Run flows, list them, and receive signed webhooks. The server is stateless and has no database.
    Generate a client for your language from this file with any OpenAPI generator.
servers:
  - url: http://localhost:8080
security:
  - bearer: []
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      description: Needs no token. Use it for container and load balancer probes.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /openapi.json:
    get:
      operationId: getOpenApi
      summary: Get the OpenAPI spec of the loaded flows
      description: |
        This document with one typed `run<FlowId>` operation for each loaded flow, built from the flows the
        server loaded. `POST /v1/flows/{id}/run` is replaced by these operations. Generate clients from it.
        It needs the bearer token when tokens are configured, because it lists flow names and input schemas.
      responses:
        "200":
          description: An OpenAPI 3.1 document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/flows:
    get:
      operationId: listFlows
      summary: List flows
      responses:
        "200":
          description: The flows loaded at startup.
          content:
            application/json:
              schema:
                type: object
                required: [flows]
                properties:
                  flows:
                    type: array
                    items: { $ref: "#/components/schemas/FlowSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/runs:
    get:
      operationId: listRuns
      summary: List finished runs
      description: |
        The newest runs of the API, newest first. Which runs are kept, and for how long, is set by `server.runs`:
        the newest `max` runs, in memory or in a file. A run answered from the flow cache is not listed again.
      parameters:
        - name: flow
          in: query
          required: false
          description: Only runs of this flow.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Most runs to return, from 1 to 500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/RunSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/runs/{id}:
    get:
      operationId: getRun
      summary: Get a finished run
      description: "The trace of one run. With `server.runs.record: full` it also holds the input and every node result."
      parameters:
        - name: id
          in: path
          required: true
          description: Run id, from a run result or from `GET /v1/runs`.
          schema: { type: string }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: Unknown run, or one that is no longer kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/flows/{id}/run:
    post:
      operationId: runFlow
      summary: Run a flow
      description: |
        Runs the flow and returns its trace. The response is `200` even when a node failed, so check `ok`.

        Send `Accept: text/event-stream` to receive events while the run progresses. The event names are
        `node:start`, `node:done`, `node:error`, `node:skipped` and `provider:call`, and the last event is
        `result` with the same body as the JSON response. If the server is busy, the stream ends with a `result`
        event that carries an `error` instead of an HTTP `503`. Closing the connection cancels the run.

        Send an `Idempotency-Key` to make retries safe. A retry with the same key and input returns the first
        successful result with the header `Idempotent-Replayed: true` instead of running the flow again.
        The header is ignored for event streams.

        Send `X-Milford-Timeout-Ms` to bound this run from the default `server.run.timeoutMs` (60 seconds).
        The run is aborted after that many milliseconds, for JSON and event-stream runs alike.
      parameters:
        - name: id
          in: path
          required: true
          description: Flow id.
          schema: { type: string }
        - name: X-Milford-Timeout-Ms
          in: header
          required: false
          description: |
            Milliseconds after which this run is aborted, from 1 to 600000. Overrides the
            `run.timeoutMs` served default (60 seconds) for this request only. Not a whole number,
            below 1 or above 600000: `400`.
          schema: { type: integer, minimum: 1, maximum: 600000 }
        - name: Cache-Control
          in: header
          required: false
          description: |
            Only for flows that declare `cache`. `no-cache` skips the lookup and runs the flow again, then stores
            the fresh result. `no-store` neither reads nor writes the cache. Ignored for event streams, which
            are never cached.
          schema: { type: string, enum: [no-cache, no-store] }
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Any string that is unique per logical request, for example an MQ message id. Results are kept
            for `server.idempotencyTtlMs` (default 10 minutes), per server instance, and are lost on restart.
            Failed runs are not kept, so a retry after a failure runs again.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  description: Run input. Templates read it as `{{input.field}}`.
                  additionalProperties: true
            example:
              input:
                service: payments
                message: "Connection refused: db-primary:5432"
      responses:
        "200":
          description: The run finished. Check `ok` for node failures.
          headers:
            Idempotent-Replayed:
              description: Present with the value `true` when the result is a replay of an earlier request with the same key.
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResult" }
            text/event-stream:
              schema:
                type: string
                description: Server-sent events. See the operation description.
        "400":
          description: |
            The body is not JSON, `input` is not an object, or `input` does not match the flow's declared
            input schema. Also when `X-Milford-Timeout-Ms` is not a whole number from 1 to 600000.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: Unknown flow id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: The `Idempotency-Key` was already used with a different input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The engine could not run the flow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Too many runs are active. Retry after the delay in `Retry-After`.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/chat/completions:
    post:
      operationId: chatCompletions
      summary: Run a flow as an OpenAI-compatible chat completion
      description: |
        An OpenAI-compatible subset of `POST /chat/completions`, for existing OpenAI SDK clients. The
        `model` field is the id of a loaded flow. The request runs that flow with
        `input = { model, messages, prompt }`, where `prompt` is the content of the last user message, and
        the output node's text becomes the assistant message.

        `stream: true` returns OpenAI-style server-sent events (one `chat.completion.chunk` per delta, then
        `[DONE]`). The run finishes before the stream starts, so errors such as a busy server come back as
        normal HTTP status codes (503 with `Retry-After`) rather than mid-stream.

        Extra OpenAI fields (`temperature`, `max_tokens`, `top_p`, ...) are accepted and ignored: the flow
        controls behaviour, not the caller. Embeddings, tool calls and other OpenAI APIs are not supported.
        Auth, limits, caching and `X-Milford-Timeout-Ms` behave like the other `/v1/*` routes.
      parameters:
        - name: X-Milford-Timeout-Ms
          in: header
          required: false
          description: |
            Milliseconds after which this run is aborted, from 1 to 600000. Overrides the
            `run.timeoutMs` served default (60 seconds) for this request only. Not a whole number,
            below 1 or above 600000: `400`.
          schema: { type: integer, minimum: 1, maximum: 600000 }
        - name: Cache-Control
          in: header
          required: false
          description: |
            Only for flows that declare `cache`. `no-cache` skips the lookup and runs the flow again, then
            stores the fresh result. `no-store` neither reads nor writes the cache.
          schema: { type: string, enum: [no-cache, no-store] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  description: The id of the loaded flow to run.
                messages:
                  type: array
                  description: Chat messages. The last user message becomes `input.prompt`.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [system, user, assistant] }
                      content: { type: string }
                stream:
                  type: boolean
                  default: false
                  description: Stream the answer as OpenAI-style SSE chunks ending in `[DONE]`.
                temperature: { type: number, description: Accepted and ignored; the flow controls behaviour. }
                max_tokens: { type: integer, description: Accepted and ignored; the flow controls behaviour. }
                top_p: { type: number, description: Accepted and ignored; the flow controls behaviour. }
                user: { type: string, description: Accepted and ignored. }
      responses:
        "200":
          description: "The flow's output node text, or an event stream when `stream: true`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
            text/event-stream:
              schema:
                type: string
                description: |
                  One `data:` line per `chat.completion.chunk` (role, content, then the finish delta), and a
                  final `data: [DONE]`. The verbatim bytes of the content are the flow output; they are not
                  escaped or framed again.
        "400":
          description: |
            The body is not JSON, `model` is missing, `messages` is not an array of `{ role, content }`,
            `stream` is not a boolean, or `X-Milford-Timeout-Ms` is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The `model` is not the id of a loaded flow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAiError" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: The engine could not run the flow, or a node failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAiError" }
        "503":
          description: Too many runs are active. Retry after the delay in `Retry-After`.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAiError" }
  /hooks/{id}:
    post:
      operationId: webhook
      summary: Send a signed webhook
      description: |
        Runs the flow of a webhook channel. It does not use the bearer token. Sign the request instead:
        `x-milford-signature` is `sha256=` plus the hex HMAC-SHA256 of `<x-milford-timestamp>.<raw body>` with the
        channel secret. Timestamps more than five minutes from the server clock are rejected.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Channel id.
          schema: { type: string }
        - name: x-milford-timestamp
          in: header
          required: true
          description: Current Unix time in seconds.
          schema: { type: string }
        - name: x-milford-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The whole body becomes the flow input.
              additionalProperties: true
      responses:
        "200":
          description: The flow ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "400":
          description: The body is not a JSON object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid or stale signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: One of `server.auth.tokens`. With no tokens configured the API is open.
  responses:
    Unauthorized:
      description: The bearer token is missing or wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: The caller is over the rate limit set by `server.rateLimit`. Retry after the delay in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The body is larger than `server.maxBodyBytes`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    FlowSummary:
      type: object
      required: [id, nodes]
      properties:
        id: { type: string }
        nodes: { type: integer, description: Number of nodes in the flow. }
        description: { type: string, description: What the flow does. }
        input:
          type: object
          description: JSON Schema of the run input, when the flow declares one.
          additionalProperties: true
    RunSummary:
      type: object
      required: [runId, flow, startedAt, ms, ok, nodes]
      properties:
        runId: { type: string }
        flow: { type: string }
        startedAt: { type: string, format: date-time }
        ms: { type: integer, description: Duration of the run in milliseconds. }
        ok: { type: boolean, description: False when any node failed. }
        nodes: { type: integer, description: Number of nodes that have a state in the trace. }
    RunRecord:
      type: object
      required: [runId, flow, startedAt, ms, ok, nodes]
      properties:
        runId: { type: string }
        flow: { type: string }
        startedAt: { type: string, format: date-time }
        ms: { type: integer }
        ok: { type: boolean }
        caller: { type: string, description: "Hashed bearer token of the caller that saved the run, when the server has auth on. Only that caller can list or read it." }
        nodes:
          type: object
          description: The trace, keyed by node id.
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [done, error, skipped] }
              ms: { type: integer }
              error: { type: string }
              result: { $ref: "#/components/schemas/NodeResult" }
        input:
          type: object
          additionalProperties: true
          description: "The run input. Only with `server.runs.record: full`."
        output:
          $ref: "#/components/schemas/NodeResult"
    NodeResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        output: { type: string, description: Text that downstream templates can use. }
        data:
          description: Structured value. For a `decision` node it holds `choice`, `confidence`, `probabilities` and more.
        error: { type: string }
    NodeState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [done, error, skipped] }
        result: { $ref: "#/components/schemas/NodeResult" }
        ms: { type: number, description: Node duration in milliseconds. }
    RunResult:
      type: object
      required: [ok, runId, nodes]
      properties:
        ok: { type: boolean, description: False when any node failed. }
        timedOut: { type: boolean, description: "True when the run was cut short by `run.timeoutMs`. Nodes that never started report status `error` with error `aborted`." }
        runId: { type: string }
        nodes:
          type: object
          description: The trace, keyed by node id.
          additionalProperties: { $ref: "#/components/schemas/NodeState" }
        output:
          description: Result of the flow's `output` node, when one ran.
          $ref: "#/components/schemas/NodeResult"
        cache:
          type: string
          enum: [hit, miss]
          description: |
            Only present for flows that declare `cache`. `hit` is the result of an earlier identical run, with
            its `runId` and trace, and no node ran. `miss` is a fresh run.
    WebhookResult:
      type: object
      required: [ok, runId]
      properties:
        ok: { type: boolean }
        runId: { type: string }
        output: { type: string }
        data: {}
    OpenAiError:
      type: object
      description: OpenAI-compatible error envelope.
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, param, code]
          properties:
            message: { type: string }
            type: { type: string, enum: [invalid_request_error, server_error] }
            param: { type: [string, "null"] }
            code: { type: [string, "null"] }
    ChatCompletion:
      type: object
      description: A completed chat completion, shaped like the OpenAI API.
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string, description: "`chatcmpl-` followed by the Milford run id." }
        object: { type: string, const: "chat.completion" }
        created: { type: integer, description: Unix time in seconds the response was built. }
        model: { type: string, description: The flow id that was run. }
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer, const: 0 }
              message:
                type: object
                required: [role, content]
                properties:
                  role: { type: string, const: "assistant" }
                  content: { type: string, description: The flow's output node text. }
              finish_reason: { type: string, const: "stop" }
        usage:
          type: object
          description: "Always zero: Milford does not count tokens."
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens: { type: integer, const: 0 }
            completion_tokens: { type: integer, const: 0 }
            total_tokens: { type: integer, const: 0 }
