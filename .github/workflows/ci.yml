name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Core stays vendor-neutral
        run: "! grep -rniE 'typesafe|jev' packages/core/src"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Fast tier (MIL-69): the black-box suite gates every pull request. It starts the built
      # server from packages/server/dist and tests it over HTTP.
      - name: End-to-end suite (fast tier)
        run: |
          cd test
          pnpm install --frozen-lockfile
          pnpm test
