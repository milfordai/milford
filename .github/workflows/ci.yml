name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Core stays vendor-neutral
        run: "! grep -rniE 'typesafe|jev' packages/core/src"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          verbose: true
      # Fast tier (MIL-69): the black-box suite gates every pull request. It starts the built
      # server from packages/server/dist and tests it over HTTP.
      - name: End-to-end suite (fast tier)
        run: |
          cd test
          pnpm install --frozen-lockfile
          pnpm test
  # Latency gate (MIL-73): reruns the benchmarks and fails when a p95 regresses more than
  # +10% vs this platform's section in bench/baseline.json. Until a linux-x64 section is
  # committed, the first run here fails with its own numbers printed — record those numbers
  # in the platforms section and every later run gates properly.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Latency gate
        run: node bench/run.mjs
